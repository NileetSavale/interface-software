[project]
name = "interface"
version = "0.1.0"
description = "Computer-use automation: LLM discovery, recorded capability artifacts, deterministic replay"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.163.0",
    "playwright>=1.65.2",
    "pydantic>=2.9",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
]

[project.scripts]
interface = "interface.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interface"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
