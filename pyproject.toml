[project]
name = "interfaze"
version = "0.1.0"
description = "Computer-use automation: LLM discovery, recorded capability artifacts, deterministic replay"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/interfaze"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
