# The test suite on a clean Linux machine, with no API key: discovery runs on a scripted planner, so nothing here
# calls a model or spends money.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q
      # A failed run's own record: event logs, masked screenshots and snapshots, server logs. Everything under runs/
      # is already redacted (no secrets here anyway: CI has none and the mocks hold fake data)
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runs
          path: runs/
          retention-days: 7
